name: Go verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Transport peer-PID test
        run: go test ./daemonctl -run '^TestPeerPIDComesFromTransportNotRequest$' -count=1
      - name: Transport peer-PID race test
        if: always()
        run: go test -race ./daemonctl -run '^TestPeerPIDComesFromTransportNotRequest$' -count=1
      - name: Full suite (Linux baseline)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... && go test -race ./...
      - name: Vet
        if: always()
        run: go vet ./...
